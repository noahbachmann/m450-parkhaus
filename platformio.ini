; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = kasse, schranken

[rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags = -I src/common
lib_deps = bblanchon/ArduinoJson@^7
monitor_speed = 115200

[env:kasse]
extends = rp2040
build_src_filter = +<kasse/> +<common/>

[env:schranken]
extends = rp2040
build_src_filter = +<schranken/> +<common/>

[env:native]
platform = native
lib_deps = bblanchon/ArduinoJson@^7

; PC simulator of both Picos (same lib/ code), see README. Start: pio run -e sim -t exec
[env:sim]
platform = native
build_src_filter = +<sim/>
lib_deps = bblanchon/ArduinoJson@^7
extra_scripts = pre:scripts/sim_link.py
test_ignore = *
