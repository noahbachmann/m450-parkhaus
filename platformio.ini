; PlatformIO project: two Pico W boards (kasse, schranken), host tests (native), PC simulator (sim_*).
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = kasse, schranken

[env]
lib_deps = bblanchon/ArduinoJson@7.4.3

[rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
build_flags = -I src/common
monitor_speed = 115200
; no on-board test suites: the logic is tested under native
test_ignore = *

[env:kasse]
extends = rp2040
build_src_filter = +<kasse/> +<common/>

[env:schranken]
extends = rp2040
build_src_filter = +<schranken/> +<common/>

; Wiring check for Pico 2 (servos + loops), see docs/aufbau-anleitung.md. Not in default_envs.
[env:hwtest]
extends = rp2040
build_src_filter = +<hwtest/>
lib_deps =

; Unit and system tests of lib/ on the PC: pio test -e native
[env:native]
platform = native
build_src_filter = -<*>
test_filter = native/*

; PC simulator (same lib/ code as the firmware), see README "PC-Simulator". Docker: docker compose up --build
; Without Docker, two terminals: pio run -e sim_kasse -t exec / pio run -e sim_schranken -t exec
[sim]
platform = native
build_flags = -I src/sim/common
extra_scripts = pre:scripts/sim_link.py
test_ignore = *

[env:sim_kasse]
extends = sim
build_src_filter = +<sim/common/> +<sim/kasse/>

[env:sim_schranken]
extends = sim
build_src_filter = +<sim/common/> +<sim/schranken/>
