# PC simulator: Pico 1 "Kasse" (JSON API, sessions) and Pico 2 "Schranken" (all pages, barriers), talking HTTP
# like the real boards. Start: docker compose up --build, then http://localhost:8082
services:
  kasse:
    build: .
    image: parkhaus-sim
    command: sim_kasse
    init: true
    environment:
      # shared key Pico 2 -> Pico 1 (X-Api-Key); same value in both services
      KASSE_API_KEY: ${KASSE_API_KEY:-parkhaus-sim}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./sim-data/kasse:/data

  schranken:
    image: parkhaus-sim # built by the kasse service
    command: sim_schranken
    init: true
    environment:
      KASSE_URL: http://kasse:8081
      # login «betrieb»; credentials overview: README.md, "Zugangsdaten für Entwicklung und Test"
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-parkhaus}
      KASSE_API_KEY: ${KASSE_API_KEY:-parkhaus-sim}
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./sim-data/schranken:/data
    depends_on:
      - kasse # also makes compose build the image (kasse) before starting schranken
